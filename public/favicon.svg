
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Первая звезда (верхняя) -->
  <polygon 
    points="50,10 55,30 75,30 60,40 65,60 50,50 35,60 40,40 25,30 45,30" 
    fill="#FBB040" 
    stroke="#FFFFFF" 
    stroke-width="2"
  />
  
  <!-- Вторая звезда (нижняя левая) -->
  <polygon 
    points="25,55 30,75 50,75 35,85 40,95 25,85 10,95 15,85 0,75 20,75" 
    fill="#FBB040" 
    stroke="#FFFFFF" 
    stroke-width="2"
  />
  
  <!-- Третья звезда (нижняя правая) -->
  <polygon 
    points="75,55 80,75 100,75 85,85 90,95 75,85 60,95 65,85 50,75 70,75" 
    fill="#FBB040" 
    stroke="#FFFFFF" 
    stroke-width="2"
  />
  
  <!-- Анимация мерцания для всех звезд -->
  <animate 
    attributeName="opacity" 
    values="0.7;1;0.7" 
    dur="5s" 
    repeatCount="indefinite" 
  />
</svg>
