
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Первая звезда (верхняя) -->
  <polygon 
    points="100,20 110,60 150,60 120,80 130,120 100,100 70,120 80,80 50,60 90,60" 
    fill="#FBB040" 
    stroke="#222222" 
    stroke-width="2"
  />
  
  <!-- Вторая звезда (нижняя левая) -->
  <polygon 
    points="50,110 60,150 100,150 70,170 80,190 50,170 20,190 30,170 0,150 40,150" 
    fill="#FBB040" 
    stroke="#222222" 
    stroke-width="2"
  />
  
  <!-- Третья звезда (нижняя правая) -->
  <polygon 
    points="150,110 160,150 200,150 170,170 180,190 150,170 120,190 130,170 100,150 140,150" 
    fill="#FBB040" 
    stroke="#222222" 
    stroke-width="2"
  />
</svg>
